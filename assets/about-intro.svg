<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="ab-t ab-d">
  <title id="ab-t">About Varsha K S</title>
  <desc id="ab-d">AI &amp; Data Science undergraduate and ServiceNow Certified Application Developer (CAD) specializing in ServiceNow application development, workflow automation, and AI-driven solutions.</desc>
  <defs>
    <linearGradient id="ab-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050B17"/><stop offset="100%" stop-color="#0B1C3B"/></linearGradient>
    <radialGradient id="ab-glow" cx="80%" cy="20%" r="70%"><stop offset="0" stop-color="#7A4BA8" stop-opacity=".45"/><stop offset="60%" stop-color="#6EC9E8" stop-opacity=".1"/><stop offset="100%" stop-color="#0B1C3B" stop-opacity="0"/></radialGradient>
    <pattern id="ab-scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#6EC9E8" opacity=".03"/></pattern>
    <clipPath id="ab-c0"><rect class="ab-type" x="68" y="112" width="89" height="22" style="animation-delay:0.60s;animation-duration:0.41s;animation-timing-function:steps(6)"/></clipPath>
    <clipPath id="ab-c1"><rect class="ab-type" x="68" y="137" width="560" height="22" style="animation-delay:1.16s;animation-duration:0.53s;animation-timing-function:steps(1)"/></clipPath>
    <clipPath id="ab-c2"><rect class="ab-type" x="68" y="162" width="179" height="22" style="animation-delay:2.04s;animation-duration:0.56s;animation-timing-function:steps(17)"/></clipPath>
    <clipPath id="ab-c3"><rect class="ab-type" x="68" y="187" width="600" height="22" style="animation-delay:2.75s;animation-duration:0.53s;animation-timing-function:steps(1)"/></clipPath>
    <clipPath id="ab-c4"><rect class="ab-type" x="68" y="212" width="188" height="22" style="animation-delay:3.63s;animation-duration:0.59s;animation-timing-function:steps(18)"/></clipPath>
    <clipPath id="ab-c5"><rect class="ab-type" x="68" y="237" width="600" height="22" style="animation-delay:4.37s;animation-duration:0.53s;animation-timing-function:steps(1)"/></clipPath>
    <clipPath id="ab-c6"><rect class="ab-type" x="68" y="262" width="138" height="22" style="animation-delay:5.25s;animation-duration:0.41s;animation-timing-function:steps(12)"/></clipPath>
    <clipPath id="ab-c7"><rect class="ab-type" x="68" y="287" width="600" height="22" style="animation-delay:5.81s;animation-duration:0.53s;animation-timing-function:steps(1)"/></clipPath>
    <clipPath id="ab-c8"><rect class="ab-type" x="68" y="312" width="163" height="22" style="animation-delay:6.69s;animation-duration:0.49s;animation-timing-function:steps(15)"/></clipPath>
    <clipPath id="ab-c9"><rect class="ab-type" x="68" y="337" width="620" height="22" style="animation-delay:7.34s;animation-duration:0.53s;animation-timing-function:steps(1)"/></clipPath>
  </defs>
  <style>
    .ab-serif { font-family: Georgia, serif; }
    .ab-mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .ab-sans { font-family: 'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .ab-type { transform-box: fill-box; transform-origin: left center; animation-name: ab-type; animation-fill-mode: both; }
    @keyframes ab-type { 0% { transform: scaleX(0); } 85%, 100% { transform: scaleX(1); } }
  </style>
  <rect width="1200" height="420" rx="20" fill="url(#ab-bg)"/>
  <rect width="1200" height="420" rx="20" fill="url(#ab-glow)"/>
  <rect x=".5" y=".5" width="1199" height="419" rx="19.5" fill="none" stroke="#7A4BA8" stroke-opacity=".4"/>

  <!-- Terminal window in Cosmic Space Navy -->
  <g class="ab-fade">
    <rect x="40" y="40" width="760" height="340" rx="14" fill="#060F20" stroke="#6EC9E8" stroke-opacity=".45"/>
    <rect x="40" y="40" width="760" height="340" rx="14" fill="url(#ab-scan)"/>
    <path d="M40 54 a14 14 0 0 1 14 -14 H786 a14 14 0 0 1 14 14 V76 H40 Z" fill="#0B1C3B"/>
    <line x1="40" y1="76" x2="800" y2="76" stroke="#7A4BA8" stroke-opacity=".5"/>
    <circle cx="62" cy="58" r="5" fill="#F6D48F"/><circle cx="80" cy="58" r="5" fill="#D58BE8"/><circle cx="98" cy="58" r="5" fill="#6EC9E8"/>
    <text class="ab-mono" x="420" y="62" text-anchor="middle" font-size="11" letter-spacing="1.5" fill="#6EC9E8">varsha@cosmic-portfolio: ~</text>
  </g>
  <g class="ab-mono" font-size="13">
      <g clip-path="url(#ab-c0)"><text x="72" y="128" fill="#6EC9E8">$</text><text x="94" y="128" fill="#ffffff">whoami</text></g>
      <g clip-path="url(#ab-c1)"><text x="72" y="153" fill="#D58BE8">→</text><text x="94" y="153" fill="#E0D4EC">Varsha K S · AI &amp; Data Science · ServiceNow CAD</text></g>
      <g clip-path="url(#ab-c2)"><text x="72" y="178" fill="#6EC9E8">$</text><text x="94" y="178" fill="#ffffff">cat education.txt</text></g>
      <g clip-path="url(#ab-c3)"><text x="72" y="203" fill="#D58BE8">→</text><text x="94" y="203" fill="#E0D4EC">B.Tech AI &amp; Data Science · Dhanalakshmi Srinivasan (CGPA: 8.65)</text></g>
      <g clip-path="url(#ab-c4)"><text x="72" y="228" fill="#6EC9E8">$</text><text x="94" y="228" fill="#ffffff">cat focus.txt</text></g>
      <g clip-path="url(#ab-c5)"><text x="72" y="253" fill="#D58BE8">→</text><text x="94" y="253" fill="#E0D4EC">ServiceNow CAD · Flow Designer · ATF · AI/ML · MERN</text></g>
      <g clip-path="url(#ab-c6)"><text x="72" y="278" fill="#6EC9E8">$</text><text x="94" y="278" fill="#ffffff">ls ./projects</text></g>
      <g clip-path="url(#ab-c7)"><text x="72" y="303" fill="#D58BE8">→</text><text x="94" y="303" fill="#E0D4EC">medical-diagnosis-portal   smartit-incident-mgmt   hiv-forecasting-ml</text></g>
      <g clip-path="url(#ab-c8)"><text x="72" y="328" fill="#6EC9E8">$</text><text x="94" y="328" fill="#ffffff">echo $MISSION</text></g>
      <g clip-path="url(#ab-c9)"><text x="72" y="353" fill="#D58BE8">→</text><text x="94" y="353" fill="#E0D4EC">scalable applications, workflow automation, and AI-driven solutions</text></g>
  </g>
  <rect x="72" y="364" width="8" height="16" fill="#6EC9E8">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- Right Cards in Galaxy Midnight & Lilac/Cyan accents -->
  <g class="ab-card"><g transform="translate(836 60)">
    <rect width="324" height="92" rx="14" fill="#0B1C3B" stroke="#7A4BA8" stroke-opacity=".7" stroke-width="1.2"/>
    <rect x="0" y="0" width="4" height="92" rx="2" fill="#6EC9E8"/>
    <text class="ab-mono" x="22" y="28" font-size="10" letter-spacing="2" fill="#6EC9E8">PRIMARY EXPERTISE</text>
    <text class="ab-serif" x="22" y="60" font-size="24" font-weight="300" fill="#F6D48F">ServiceNow CAD</text>
    <text class="ab-sans" x="22" y="80" font-size="12" fill="#D58BE8">Flow Designer · ATF · ITSM · Service Portal</text>
  </g></g>

  <g class="ab-card"><g transform="translate(836 166)">
    <rect width="324" height="92" rx="14" fill="#0B1C3B" stroke="#7A4BA8" stroke-opacity=".7" stroke-width="1.2"/>
    <rect x="0" y="0" width="4" height="92" rx="2" fill="#D58BE8"/>
    <text class="ab-mono" x="22" y="28" font-size="10" letter-spacing="2" fill="#D58BE8">AI &amp; FULL-STACK</text>
    <text class="ab-serif" x="22" y="60" font-size="24" font-weight="300" fill="#ffffff">ML &amp; MERN Stack</text>
    <text class="ab-sans" x="22" y="80" font-size="12" fill="#C5B8DA">Scikit-Learn · Python · React &amp; Node APIs</text>
