  <g class="ab-card"><g transform="translate(836 272)">
    <rect width="324" height="92" rx="14" fill="#0B1C3B" stroke="#7A4BA8" stroke-opacity=".7" stroke-width="1.2"/>
    <rect x="0" y="0" width="4" height="92" rx="2" fill="#F6D48F"/>
    <text class="ab-mono" x="22" y="28" font-size="10" letter-spacing="2" fill="#F6D48F">LOCATION &amp; AVAILABILITY</text>
    <text class="ab-serif" x="22" y="60" font-size="24" font-weight="300" fill="#6EC9E8">Palakkad, Kerala</text>
    <text class="ab-sans" x="22" y="80" font-size="12" fill="#C5B8DA">Open to On-site, Hybrid &amp; Remote Roles</text>
