<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="ce-t ce-d">
  <title id="ce-t">Certifications &amp; Credentials</title>
  <desc id="ce-d">ServiceNow Certified Application Developer (CAD); IBM SkillsBuild Introduction to Generative AI; Generative AI Mastery Workshop by NXT WAVE and OpenAI Academy; MongoDB Basics For Students by MongoDB.</desc>
  <defs>
    <linearGradient id="ce-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050B17"/><stop offset="100%" stop-color="#0B1C3B"/></linearGradient>
    <radialGradient id="ce-glow" cx="15%" cy="100%" r="70%"><stop offset="0" stop-color="#7A4BA8" stop-opacity=".4"/><stop offset="100%" stop-color="#0B1C3B" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .ce-serif { font-family: Georgia, serif; }
    .ce-mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .ce-sans { font-family: 'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  </style>
  <rect width="1200" height="420" rx="20" fill="url(#ce-bg)"/>
  <rect width="1200" height="420" rx="20" fill="url(#ce-glow)"/>
  <rect x=".5" y=".5" width="1199" height="419" rx="19.5" fill="none" stroke="#7A4BA8" stroke-opacity=".4"/>

  <!-- Row 1: 2 Tiles -->
  <g class="ce-tile" transform="translate(60, 40)">
    <rect width="520" height="155" rx="14" fill="#0B1C3B" stroke="#6EC9E8" stroke-opacity=".6" stroke-width="1.2"/>
    <text class="ce-mono" x="24" y="34" font-size="11" letter-spacing="2.6" fill="#6EC9E8">SERVICENOW · OFFICIAL CERTIFICATION</text>
    <circle cx="485" cy="28" r="4.5" fill="#F6D48F"/>
    <line x1="24" y1="50" x2="495" y2="50" stroke="#6EC9E8" stroke-opacity=".3"/>
    <text class="ce-serif" x="24" y="86" font-size="22" font-weight="300" fill="#F6D48F">Certified Application Developer (CAD)</text>
    <text class="ce-sans" x="24" y="112" font-size="13.5" fill="#ffffff">ServiceNow Certified Professional</text>
    <text class="ce-sans" x="24" y="134" font-size="12" fill="#C5B8DA">Application Development, Flow Designer, ATF, ITSM &amp; ACLs</text>
  </g>

  <g class="ce-tile" transform="translate(620, 40)">
    <rect width="520" height="155" rx="14" fill="#0B1C3B" stroke="#D58BE8" stroke-opacity=".6" stroke-width="1.2"/>
    <text class="ce-mono" x="24" y="34" font-size="11" letter-spacing="2.6" fill="#D58BE8">IBM SKILLSBUILD</text>
    <circle cx="485" cy="28" r="4.5" fill="#F6D48F"/>
    <line x1="24" y1="50" x2="495" y2="50" stroke="#D58BE8" stroke-opacity=".3"/>
    <text class="ce-serif" x="24" y="86" font-size="22" font-weight="300" fill="#ffffff">Introduction to Generative AI</text>
    <text class="ce-sans" x="24" y="112" font-size="13.5" fill="#6EC9E8">IBM SkillsBuild Credential</text>
    <text class="ce-sans" x="24" y="134" font-size="12" fill="#C5B8DA">Foundation models, generative architectures &amp; prompt engineering</text>
  </g>

  <!-- Row 2: 2 Tiles -->
  <g class="ce-tile" transform="translate(60, 225)">
    <rect width="520" height="155" rx="14" fill="#0B1C3B" stroke="#7A4BA8" stroke-opacity=".6" stroke-width="1.2"/>
    <text class="ce-mono" x="24" y="34" font-size="11" letter-spacing="2.6" fill="#F6D48F">NXT WAVE &amp; OPENAI ACADEMY</text>
    <circle cx="485" cy="28" r="4.5" fill="#F6D48F"/>
    <line x1="24" y1="50" x2="495" y2="50" stroke="#7A4BA8" stroke-opacity=".3"/>
    <text class="ce-serif" x="24" y="86" font-size="22" font-weight="300" fill="#ffffff">Generative AI Mastery Workshop</text>
    <text class="ce-sans" x="24" y="112" font-size="13.5" fill="#D58BE8">NXT WAVE &amp; OpenAI Academy</text>
    <text class="ce-sans" x="24" y="134" font-size="12" fill="#C5B8DA">Applied Generative AI, workflow intelligence &amp; LLM capabilities</text>
  </g>

  <g class="ce-tile" transform="translate(620, 225)">
    <rect width="520" height="155" rx="14" fill="#0B1C3B" stroke="#6EC9E8" stroke-opacity=".6" stroke-width="1.2"/>
    <text class="ce-mono" x="24" y="34" font-size="11" letter-spacing="2.6" fill="#6EC9E8">MONGODB</text>
    <circle cx="485" cy="28" r="4.5" fill="#F6D48F"/>
    <line x1="24" y1="50" x2="495" y2="50" stroke="#6EC9E8" stroke-opacity=".3"/>
    <text class="ce-serif" x="24" y="86" font-size="22" font-weight="300" fill="#ffffff">MongoDB Basics For Students</text>
    <text class="ce-sans" x="24" y="112" font-size="13.5" fill="#6EC9E8">MongoDB Student Credential</text>
    <text class="ce-sans" x="24" y="134" font-size="12" fill="#C5B8DA">Document database design, schema architecture &amp; CRUD operations</text>
  </g>
</svg>