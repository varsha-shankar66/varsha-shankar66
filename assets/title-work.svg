<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 110" width="1200" height="110" role="img" aria-label="03 SELECTED WORK: not assignments.">
  <defs>
    <linearGradient id="t-line-03" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="1160" y2="0">
      <stop offset="0" stop-color="#6EC9E8"/>
      <stop offset=".4" stop-color="#D58BE8"/>
      <stop offset=".8" stop-color="#7A4BA8"/>
      <stop offset="1" stop-color="#0B1C3B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="t-sheen-03" gradientUnits="userSpaceOnUse" x1="-300" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".5" stop-color="#F6D48F"/>
      <stop offset="1" stop-color="#D58BE8"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1500 0;1500 0" keyTimes="0;.4;1" dur="7s" begin="1.5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="t-pulse-03">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#6EC9E8" stop-opacity=".7"/>
      <stop offset="1" stop-color="#7A4BA8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .t-serif { font-family: Georgia, 'Iowan Old Style', serif; }
    .t-mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>
  <g>
    <text class="t-mono" x="40" y="32" font-size="12" letter-spacing="3" fill="#6EC9E8"><tspan fill="#F6D48F">03</tspan>   SELECTED WORK</text>
  </g>
  <g>
    <text class="t-serif" x="38" y="76" font-size="38" font-weight="300" letter-spacing="-1" fill="#ffffff">Products, <tspan font-style="italic" fill="url(#t-sheen-03)">not assignments.</tspan></text>
  </g>
  <g>
    <text class="t-mono" x="1160" y="32" text-anchor="end" font-size="10.5" letter-spacing="2.4" fill="#6EC9E8">✦ FEATURED</text>
  </g>
  <path d="M40 96 H1160" stroke="url(#t-line-03)" stroke-width="1.4"/>
  <circle cx="40" cy="96" r="6" fill="url(#t-pulse-03)" opacity="0">
    <animate attributeName="cx" values="40;1160" dur="6s" begin="2.3s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .55 1"/>
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;.15;1" dur="6s" begin="2.3s" repeatCount="indefinite"/>
  </circle>
</svg>