<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 110" width="1200" height="110" role="img" aria-label="04 TOOLKIT: The Tools I Reach For.">
  <defs>
    <linearGradient id="t-line-04" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="1160" y2="0">
      <stop offset="0" stop-color="#df2531"/><stop offset=".6" stop-color="#5a1015"/><stop offset="1" stop-color="#5a1015" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="t-sheen-04" gradientUnits="userSpaceOnUse" x1="-300" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#ff737d"/><stop offset="1" stop-color="#ffffff"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1500 0;1500 0" keyTimes="0;.4;1" dur="7s" begin="1.5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="t-pulse-04"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#ff4d5a" stop-opacity=".6"/><stop offset="1" stop-color="#df2531" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .t-serif { font-family: Georgia, 'Iowan Old Style', serif; }
    .t-mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>
  <g class="t-in">
    <text class="t-mono" x="40" y="32" font-size="12" letter-spacing="3" fill="#df2531"><tspan fill="#ffffff">04</tspan>   TOOLKIT</text>
  </g>
  <g class="t-in t-d2">
    <text class="t-serif" x="38" y="76" font-size="38" font-weight="300" letter-spacing="-1" fill="#ffffff">The <tspan font-style="italic" fill="url(#t-sheen-04)">Tools I Reach For.</tspan></text>
  </g>
  <g class="t-in t-d3">
    <text class="t-mono" x="1160" y="32" text-anchor="end" font-size="10.5" letter-spacing="2.4" fill="#df2531">LANGUAGES &amp; FRAMEWORKS</text>
  </g>
  <path class="t-draw" d="M40 96 H1160" stroke="url(#t-line-04)" stroke-width="1.2"/>
  <circle cx="40" cy="96" r="6" fill="url(#t-pulse-04)" opacity="0">
    <animate attributeName="cx" values="40;1160" dur="6s" begin="2.3s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .55 1"/>
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;.15;1" dur="6s" begin="2.3s" repeatCount="indefinite"/>
  </circle>
</svg>