<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="45%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#06080d"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="name-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e0e7ff"/>
      <stop offset="80%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.07"/>
    </pattern>

    <!-- Filter for glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)"/>

  <!-- Subtle Grid Overlay -->
  <rect width="1200" height="320" rx="16" fill="url(#grid)"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="150" cy="160" r="140" fill="url(#glow-grad)"/>
  <circle cx="950" cy="80" r="180" fill="#6366f1" fill-opacity="0.08"/>
  <circle cx="1100" cy="240" r="160" fill="#38bdf8" fill-opacity="0.06"/>

  <!-- Border Outline -->
  <rect width="1198" height="318" x="1" y="1" rx="15" fill="none" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- Modern Corner Tech Brackets -->
  <path d="M 30 50 L 30 30 L 50 30" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 1170 50 L 1170 30 L 1150 30" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 30 270 L 30 290 L 50 290" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 1170 270 L 1170 290 L 1150 290" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Decorative Tech Dots & Lines -->
  <g fill="#38bdf8" opacity="0.4">
    <circle cx="80" cy="40" r="2"/>
    <circle cx="95" cy="40" r="2"/>
    <circle cx="110" cy="40" r="2"/>
    <line x1="125" y1="40" x2="220" y2="40" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3"/>
  </g>

  <!-- Left Side: Terminal Icon / Code Symbol Graphic -->
  <g transform="translate(85, 90)">
    <!-- Terminal Outer Frame -->
    <rect width="130" height="130" rx="20" fill="#0d1424" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>
    <!-- Terminal Header Dots -->
    <circle cx="25" cy="22" r="4.5" fill="#ef4444" opacity="0.8"/>
    <circle cx="40" cy="22" r="4.5" fill="#f59e0b" opacity="0.8"/>
    <circle cx="55" cy="22" r="4.5" fill="#10b981" opacity="0.8"/>
    <!-- Code glyph: < / > or AI brain pulse -->
    <path d="M 35 60 L 52 75 L 35 90" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 60 92 L 85 92" stroke="#818cf8" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="95" cy="62" r="6" fill="#38bdf8" opacity="0.7" filter="url(#soft-glow)"/>
    <circle cx="75" cy="50" r="3.5" fill="#c084fc" opacity="0.6"/>
  </g>

  <!-- Center-Right Main Typography -->
  <g transform="translate(250, 0)">
    <!-- Status / Role Badge -->
    <g transform="translate(0, 52)">
      <rect width="210" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="16" cy="14" r="4.5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="30" y="18" fill="#94a3b8" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1">OPEN TO OPPORTUNITIES</text>
    </g>

    <!-- Main Title: VARUN VISHWA -->
    <text x="0" y="132" fill="url(#name-grad)" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Montserrat', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="4">VARUN VISHWA</text>

    <!-- Subtitle -->
    <text x="2" y="168" fill="#94a3b8" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="19" font-weight="500" letter-spacing="1.2">
      <tspan fill="#38bdf8" font-weight="600">AI Product Engineer</tspan>
      <tspan fill="#64748b">  |  </tspan>
      <tspan fill="#e2e8f0" font-weight="600">AI/ML Developer</tspan>
      <tspan fill="#64748b">  |  </tspan>
      <tspan fill="#818cf8" font-weight="600">Software Engineer</tspan>
    </text>

    <!-- Glowing Accent Divider Line -->
    <line x1="2" y1="188" x2="680" y2="188" stroke="url(#line-grad)" stroke-width="2"/>

    <!-- Tech Tag Pills -->
    <g transform="translate(0, 208)">
      <!-- Pill 1: LLMs & RAG -->
      <g transform="translate(0, 0)">
        <rect width="118" height="28" rx="8" fill="#111827" stroke="#38bdf8" stroke-opacity="0.3"/>
        <text x="59" y="18" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" text-anchor="middle">🧠 LLMs &amp; RAG</text>
      </g>
      <!-- Pill 2: Python & Flutter -->
      <g transform="translate(128, 0)">
        <rect width="145" height="28" rx="8" fill="#111827" stroke="#818cf8" stroke-opacity="0.3"/>
        <text x="72.5" y="18" fill="#a5b4fc" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ Python • Flutter</text>
      </g>
      <!-- Pill 3: N8N Automation -->
      <g transform="translate(283, 0)">
        <rect width="145" height="28" rx="8" fill="#111827" stroke="#ec4899" stroke-opacity="0.3"/>
        <text x="72.5" y="18" fill="#f472b6" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" text-anchor="middle">🔄 N8N Automation</text>
      </g>
      <!-- Pill 4: Cloud & Firebase -->
      <g transform="translate(438, 0)">
        <rect width="135" height="28" rx="8" fill="#111827" stroke="#10b981" stroke-opacity="0.3"/>
        <text x="67.5" y="18" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" text-anchor="middle">☁️ AWS • Firebase</text>
      </g>
      <!-- Pill 5: Prompt Engg -->
      <g transform="translate(583, 0)">
        <rect width="145" height="28" rx="8" fill="#111827" stroke="#f59e0b" stroke-opacity="0.3"/>
        <text x="72.5" y="18" fill="#fbbf24" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" text-anchor="middle">🎯 Prompt Engg</text>
      </g>
    </g>

    <!-- Bottom tagline -->
    <text x="2" y="272" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="12.5" font-weight="400" letter-spacing="0.5">
      Building scalable, user-centric AI applications &amp; intelligent workflow systems 🚀
    </text>
  </g>

  <!-- Right Decorative Element: Abstract Network / Constellation Nodes -->
  <g transform="translate(1040, 70)" opacity="0.6">
    <line x1="20" y1="30" x2="70" y2="60" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4"/>
    <line x1="70" y1="60" x2="40" y2="120" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.4"/>
    <line x1="70" y1="60" x2="110" y2="40" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.4"/>
    <line x1="40" y1="120" x2="90" y2="150" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4"/>
    <circle cx="20" cy="30" r="4" fill="#38bdf8"/>
    <circle cx="70" cy="60" r="5" fill="#818cf8"/>
    <circle cx="110" cy="40" r="3.5" fill="#c084fc"/>
    <circle cx="40" cy="120" r="4.5" fill="#38bdf8"/>
    <circle cx="90" cy="150" r="4" fill="#818cf8"/>
  </g>
</svg>
